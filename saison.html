<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saison</title>
<style>
  :root{
    --bg:#1f1a16; --bg2:#2a221c; --ink:#e9dccb; --muted:#a8957f; --line:#3b3028;
    --leaf1:#b07a4a; --leaf2:#8c5a34; --leaf3:#c9a27a; --snow:#efe6da; --petal:#d9b8a6; --gold:#e3b878;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;overflow:hidden}
  .wrap{position:relative;height:100%;min-height:150px;border-radius:12px;
    background:radial-gradient(120% 90% at 50% 110%,var(--bg2) 0%,var(--bg) 70%);overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .bar{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:6px;align-items:center;
    justify-content:space-between;font:12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted)}
  .title{position:absolute;left:12px;top:10px;font-size:18px;letter-spacing:.04em;font-style:italic}
  .title small{display:block;font:11px system-ui,sans-serif;font-style:normal;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .seg{display:flex;gap:2px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:2px}
  .seg button,.tog{all:unset;cursor:pointer;padding:4px 7px;border-radius:999px;color:var(--muted);font-size:12px;line-height:1}
  .seg button[aria-pressed="true"]{background:#3a2e25;color:var(--ink)}
  .tog{border:1px solid var(--line)}
  .seg button:focus-visible,.tog:focus-visible{outline:1px solid var(--gold)}
  @media (max-width:300px){.tog{font-size:0;padding:4px 6px}.tog:before{content:"⏯";font-size:12px}.seg button{padding:4px 5px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="title" id="t">Automne<small id="ts">saison du moment</small></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Saison">
      <button data-s="auto" title="Automatique (Europe/Paris)">Auto</button>
      <button data-s="automne" title="Automne">🍂</button>
      <button data-s="hiver" title="Hiver">❄</button>
      <button data-s="printemps" title="Printemps">🌸</button>
      <button data-s="ete" title="Été">☀</button>
    </div>
    <button class="tog" id="tog" aria-pressed="true" title="Animation">Animation</button>
  </div>
</div>
<script>
(function(){
  var KEY='saison-widget-v1';
  var store={get:function(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}},
             set:function(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};
  var prefs=Object.assign({season:'auto',anim:true},store.get());
  // URL overrides (?season=hiver&anim=0) — useful when storage is blocked in an embed
  var q=new URLSearchParams(location.search);
  if(q.get('season'))prefs.season=q.get('season');
  if(q.get('anim')==='0')prefs.anim=false;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function parisMonth(){
    try{return +new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',month:'numeric'}).format(new Date())}
    catch(e){return new Date().getMonth()+1}
  }
  function autoSeason(){var m=parisMonth();
    return m===12||m<=2?'hiver':m<=5?'printemps':m<=8?'ete':'automne'}
  var NAMES={automne:'Automne',hiver:'Hiver',printemps:'Printemps',ete:'Été'};
  function current(){return prefs.season==='auto'?autoSeason():prefs.season}

  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=0,H=0,dpr=1,parts=[],raf=0,t0=0;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);seed();draw(0)}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function seed(){var s=current(),n=Math.max(6,Math.round(W*H/ (s==='hiver'?2600:9000)));
    n=Math.min(n,s==='hiver'?70:16);parts=[];
    for(var i=0;i<n;i++)parts.push({x:rnd(0,W),y:rnd(-H,H),r:s==='hiver'?rnd(.6,1.8):rnd(4,7),
      vy:s==='hiver'?rnd(.15,.45):rnd(.18,.4),ph:rnd(0,6.28),sw:rnd(.3,1),rot:rnd(0,6.28),
      vr:rnd(-.01,.01),c:['--leaf1','--leaf2','--leaf3'][i%3]})}
  function col(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  function leaf(p,color){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=color;ctx.globalAlpha=.85;
    ctx.beginPath();ctx.moveTo(0,-p.r);ctx.quadraticCurveTo(p.r*.9,0,0,p.r);ctx.quadraticCurveTo(-p.r*.9,0,0,-p.r);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,-p.r);ctx.lineTo(0,p.r);ctx.stroke();ctx.restore()}
  function petal(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=col('--petal');ctx.globalAlpha=.8;
    ctx.beginPath();ctx.ellipse(0,0,p.r*.55,p.r*.32,0,0,6.28);ctx.fill();ctx.restore()}
  function tree(){var x=W-46,b=H-34,h=Math.min(58,H*.42);ctx.save();ctx.globalAlpha=.9;
    ctx.fillStyle='#3d4a3a';for(var i=0;i<3;i++){var w=h*(.55-i*.12),y=b-i*h*.28;
      ctx.beginPath();ctx.moveTo(x,y-h*.42);ctx.lineTo(x+w/2,y);ctx.lineTo(x-w/2,y);ctx.closePath();ctx.fill()}
    ctx.fillStyle='#5a4030';ctx.fillRect(x-3,b,6,7);ctx.fillStyle=col('--gold');
    ctx.beginPath();ctx.arc(x,b-h*.98,2.2,0,6.28);ctx.fill();ctx.restore()}
  function branch(){ctx.save();ctx.strokeStyle='#6b4a36';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(W,22);ctx.quadraticCurveTo(W*.72,30,W*.55,52);ctx.stroke();
    [[.78,28],[.66,38],[.58,48]].forEach(function(a){ctx.fillStyle=col('--petal');ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(W*a[0],a[1],3.2,0,6.28);ctx.fill()});ctx.restore()}
  function glow(t){var g=ctx.createRadialGradient(W*.8,-10,10,W*.8,-10,Math.max(W,H));
    var a=.18+.04*Math.sin(t/2400);g.addColorStop(0,'rgba(227,184,120,'+a+')');g.addColorStop(1,'rgba(227,184,120,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  function draw(t){var s=current();ctx.clearRect(0,0,W,H);
    if(s==='ete')glow(t);
    if(s==='printemps')branch();
    if(s==='hiver')tree();
    parts.forEach(function(p){
      if(s==='hiver'){ctx.fillStyle=col('--snow');ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();ctx.globalAlpha=1}
      else if(s==='printemps')petal(p);
      else if(s==='ete'){ctx.save();ctx.globalAlpha=.25;leaf({x:p.x,y:H*.15+(p.y%(H*.6+1)),r:p.r,rot:p.rot},col('--leaf3'));ctx.restore()}
      else leaf(p,col(p.c));
    })}
  function step(now){var s=current();var dt=Math.min(50,now-(t0||now));t0=now;var k=dt/16.7;
    parts.forEach(function(p){
      if(s==='ete'){p.rot+=Math.sin(now/1500+p.ph)*.002*k;p.x+=Math.sin(now/3000+p.ph)*.05*k;return}
      p.y+=p.vy*k;p.x+=Math.sin(now/1800+p.ph)*.25*p.sw*k;p.rot+=p.vr*k;
      if(p.y>H+10){p.y=-10;p.x=rnd(0,W)}});
    draw(now);raf=requestAnimationFrame(step)}
  function apply(){cancelAnimationFrame(raf);t0=0;var s=current();
    document.getElementById('t').firstChild.nodeValue=NAMES[s];
    document.getElementById('ts').textContent=prefs.season==='auto'?'saison du moment · Paris':'choix manuel';
    document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.s===prefs.season)});
    var tog=document.getElementById('tog');var on=prefs.anim&&!reduce;
    tog.setAttribute('aria-pressed',on);tog.textContent=reduce?'Statique':(prefs.anim?'Animation':'Pause');
    seed();draw(0);if(on)raf=requestAnimationFrame(step);
    document.documentElement.dataset.state=s+(on?'-on':'-off')}
  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){prefs.season=b.dataset.s;store.set(prefs);apply()}});
  document.getElementById('tog').onclick=function(){if(reduce)return;prefs.anim=!prefs.anim;store.set(prefs);apply()};
  document.addEventListener('visibilitychange',function(){if(document.hidden)cancelAnimationFrame(raf);else apply()});
  window.addEventListener('resize',resize);resize();apply();
})();
</script>
</body>
</html>
